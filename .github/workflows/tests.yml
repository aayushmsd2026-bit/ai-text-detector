name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  # Converts a tiny random model and checks PyTorch, Python-ONNX and browser code all agree.
  export-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt transformers onnx huggingface_hub pytest
      - name: Install the browser libraries the site uses (same versions)
        run: |
          mkdir -p /tmp/jsdeps && cd /tmp/jsdeps && npm init -y >/dev/null
          npm install onnxruntime-web@1.30.0 @huggingface/transformers@3.8.1
      - run: pytest -q tests/test_onnx_export.py -rs
        env:
          JS_DEPS: /tmp/jsdeps
