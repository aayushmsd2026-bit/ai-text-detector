# Monthly: collect fresh Claude-written samples, retrain, and republish the site.
name: retrain
on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      ai_samples:
        description: "New AI samples per Claude model"
        default: "30"
      human_samples:
        description: "Human (WikiText) samples to add on the first run"
        default: "200"

permissions:
  contents: write

env:
  OBSERVER_MODEL: ${{ vars.OBSERVER_MODEL || 'HuggingFaceTB/SmolLM2-135M' }}
  PERFORMER_MODEL: ${{ vars.PERFORMER_MODEL || 'HuggingFaceTB/SmolLM2-135M-Instruct' }}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - name: Restore converted model
        id: models
        uses: actions/cache@v4
        with:
          path: site/models
          key: onnx-${{ env.OBSERVER_MODEL }}-${{ env.PERFORMER_MODEL }}-${{ hashFiles('scripts/export_models.py') }}
      - name: Convert models (first run, or after changing models)
        if: steps.models.outputs.cache-hit != 'true'
        run: python scripts/export_models.py --out site/models

      - name: Add human samples (first run only)
        run: |
          if [ "$(ls data/human/wikitext__*.txt 2>/dev/null | wc -l)" -lt 50 ]; then
            python scripts/collect_human_samples.py --n "${{ inputs.human_samples || 200 }}"
          fi

      - name: Collect new Claude samples
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODELS: ${{ vars.CLAUDE_MODELS || 'claude-opus-5-5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping new AI samples"
          else
            python scripts/collect_ai_samples.py --n "${{ inputs.ai_samples || 30 }}"
          fi

      - name: Train
        run: python scripts/train.py

      - name: Commit data, model and report
        run: |
          git config user.name "retrain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/model.json reports
          git diff --cached --quiet || git commit -m "Monthly retrain $(date -u +%Y-%m-%d)"
          git push
