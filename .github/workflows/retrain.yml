# Monthly: collect fresh Claude-written samples, retrain, publish the new model.
name: retrain
on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      ai_samples:
        description: "New AI samples per Claude model"
        default: "30"
      human_samples:
        description: "Human (WikiText) samples to top up to on first run"
        default: "200"

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ vars.OBSERVER_MODEL || 'default' }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt

      - name: Top up human samples (first run only)
        run: |
          if [ "$(ls data/human/wikitext__*.txt 2>/dev/null | wc -l)" -lt 50 ]; then
            python scripts/collect_human_samples.py --n "${{ inputs.human_samples || 200 }}"
          fi

      - name: Collect new Claude samples
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODELS: ${{ vars.CLAUDE_MODELS || 'claude-opus-5-5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping new AI samples"
          else
            python scripts/collect_ai_samples.py --n "${{ inputs.ai_samples || 30 }}"
          fi

      - name: Train
        env:
          OBSERVER_MODEL: ${{ vars.OBSERVER_MODEL || 'Qwen/Qwen2.5-0.5B' }}
          PERFORMER_MODEL: ${{ vars.PERFORMER_MODEL || 'Qwen/Qwen2.5-0.5B-Instruct' }}
        run: python scripts/train.py

      - name: Commit data, model and report
        run: |
          git config user.name "retrain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data model reports
          git diff --cached --quiet || git commit -m "Monthly retrain $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
